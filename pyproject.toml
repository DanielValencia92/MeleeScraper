[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swu-play-analysis"
version = "0.1.0"
description = "Reproducible collection and publication tools for public SWU event research."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "selectolax>=0.3.21,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
swu-play = "swu_play.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/swu_play"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
